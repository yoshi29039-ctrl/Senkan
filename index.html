<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18">
<title>LFS-01 艦隊編成 3D Viewer</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#070b18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef3ff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:7px;flex-wrap:wrap}
button,select{background:#10182ddd;color:#eef3ff;border:1px solid #ffffff33;border-radius:10px;padding:9px 11px;font-size:13px}
#panel{position:fixed;right:10px;top:58px;width:min(340px,47vw);max-height:calc(100vh - 120px);overflow:auto;z-index:5;background:#080e20dd;border:1px solid #ffffff22;border-radius:14px;padding:10px;backdrop-filter:blur(8px)}
#panel h3{margin:3px 0 8px;font-size:14px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#fleetList{display:grid;gap:6px}.shipItem{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid #ffffff1d;border-radius:9px;background:#11182a}
.shipItem.sel{outline:2px solid #8fb0ff}.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}.shipName{font-size:12px;flex:1}.small{font-size:11px;color:#aebcdb}
#title{position:fixed;left:14px;bottom:14px;color:#dce6ff;background:#070b18aa;border:1px solid #ffffff1f;padding:8px 10px;border-radius:10px;font-size:12px}
#hint{position:fixed;right:14px;bottom:14px;color:#aebcdb;background:#070b18aa;padding:7px 9px;border-radius:10px;font-size:11px}
@media(max-width:720px){#panel{width:49vw;top:96px}.shipName{font-size:11px}}
</style>
</head>
<body>
<div id="top">
<button onclick="setView('iso')">斜め</button><button onclick="setView('front')">正面</button><button onclick="setView('side')">側面</button><button onclick="setView('top')">上面</button><button onclick="resetView()">リセット</button>
<button onclick="applyFormation('wedge')">楔形</button><button onclick="applyFormation('line')">横陣</button><button onclick="applyFormation('column')">縦陣</button><button onclick="applyFormation('convex')">凸型</button>
</div>

<div id="panel">
<h3>艦隊編成</h3>
<div class="row">
<select id="typeSel">
<option value="battleship">戦艦</option><option value="cruiser">巡洋艦</option><option value="frigate">フリゲート</option><option value="destroyer">駆逐艦</option><option value="corvette">コルベット</option><option value="support">支援艦</option>
</select>
<button onclick="addShip()">艦を追加</button><button onclick="removeSelected()">削除</button>
</div>

<h3>損傷状態</h3>
<div class="row">
<button onclick="setDamage('normal')">正常＝青</button><button onclick="setDamage('damaged')">一部損壊＝黄</button><button onclick="setDamage('critical')">大破＝赤</button><button onclick="setDamage('sunk')">撃沈＝赤</button>
</div>
<div class="small">撃沈艦は赤・暗色・半透明で表示。</div>

<h3 style="margin-top:10px">艦一覧</h3>
<div id="fleetList"></div>
</div>

<canvas id="c"></canvas>
<div id="title">LFS-01 Albion Nova — 艦隊編成 / アニメ調</div>
<div id="hint">ドラッグ: 回転 / ピンチ: 拡大縮小</div>

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl) throw new Error('WebGL unavailable');

function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}

const VS=`
attribute vec3 aPos; attribute vec3 aNor;
uniform mat4 uMVP; uniform mat4 uModel; uniform float uExpand;
varying vec3 vN;
void main(){vec3 p=aPos+aNor*uExpand; vec4 wp=uModel*vec4(p,1.0); vN=mat3(uModel)*aNor; gl_Position=uMVP*wp;}
`;
const FS=`
precision mediump float; varying vec3 vN;
uniform vec3 uBase; uniform float uAlpha; uniform float uDim;
void main(){
 vec3 N=normalize(vN),L=normalize(vec3(-.45,-.55,1.0));
 float d=max(dot(N,L),0.0),band;
 if(d>.78)band=1.0; else if(d>.48)band=.72; else if(d>.22)band=.48; else band=.30;
 vec3 col=mix(uBase*.42,uBase,band)*uDim;
 gl_FragColor=vec4(col,uAlpha);
}`;
const OFS=`precision mediump float; uniform float uAlpha; void main(){gl_FragColor=vec4(.012,.015,.03,uAlpha);}`;

const toon=program(VS,FS), outline=program(VS,OFS);
function setup(prog){
 gl.useProgram(prog);
 const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,POS,gl.STATIC_DRAW);
 const nb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,nb);gl.bufferData(gl.ARRAY_BUFFER,NOR,gl.STATIC_DRAW);
 return {pb,nb,aPos:gl.getAttribLocation(prog,'aPos'),aNor:gl.getAttribLocation(prog,'aNor'),
 uMVP:gl.getUniformLocation(prog,'uMVP'),uModel:gl.getUniformLocation(prog,'uModel'),uExpand:gl.getUniformLocation(prog,'uExpand'),
 uBase:gl.getUniformLocation(prog,'uBase'),uAlpha:gl.getUniformLocation(prog,'uAlpha'),uDim:gl.getUniformLocation(prog,'uDim')};
}
const TL=setup(toon),OL=setup(outline);
function bind(prog,L){
 gl.useProgram(prog);
 gl.bindBuffer(gl.ARRAY_BUFFER,L.pb);gl.enableVertexAttribArray(L.aPos);gl.vertexAttribPointer(L.aPos,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,L.nb);gl.enableVertexAttribArray(L.aNor);gl.vertexAttribPointer(L.aNor,3,gl.FLOAT,false,0,0);
}

function mul(a,b){let r=new Array(16).fill(0);for(let c=0;c<4;c++)for(let rr=0;rr<4;rr++)for(let k=0;k<4;k++)r[c*4+rr]+=a[k*4+rr]*b[c*4+k];return r}
function perspective(fovy,aspect,near,far){const f=1/Math.tan(fovy/2),nf=1/(near-far);return[f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,(2*far*near)*nf,0]}
function lookAt(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let zl=Math.hypot(zx,zy,zz);zx/=zl;zy/=zl;zz/=zl;let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;let xl=Math.hypot(xx,xy,xz);xx/=xl;xy/=xl;xz/=xl;let yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;return[xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1]}
function modelMatrix(x,y,z,s=1){return[s,0,0,0,0,s,0,0,0,0,s,0,x,y,z,1]}

const typeNames={battleship:'戦艦',cruiser:'巡洋艦',frigate:'フリゲート',destroyer:'駆逐艦',corvette:'コルベット',support:'支援艦'};
const typeScale={battleship:1.0,cruiser:.82,frigate:.68,destroyer:.58,corvette:.48,support:.75};
const damageColor={normal:[.20,.32,.82],damaged:[.95,.72,.08],critical:[.88,.12,.12],sunk:[.72,.06,.06]};
const damageLabel={normal:'正常',damaged:'一部損壊',critical:'大破',sunk:'撃沈'};

let fleet=[
{id:1,type:'battleship',damage:'normal',x:0,y:0,z:0},
{id:2,type:'cruiser',damage:'normal',x:-420,y:-430,z:0},
{id:3,type:'cruiser',damage:'normal',x:-420,y:430,z:0}
];
let nextId=4,selected=1;

function addShip(){
 const type=document.getElementById('typeSel').value,n=fleet.length;
 fleet.push({id:nextId,type,damage:'normal',x:-500-(n%4)*260,y:(n%5-2)*280,z:0});
 selected=nextId++;refreshList();
}
function removeSelected(){if(fleet.length<=1)return;fleet=fleet.filter(s=>s.id!==selected);selected=fleet[0]?.id||null;refreshList()}
function setDamage(d){const s=fleet.find(x=>x.id===selected);if(!s)return;s.damage=d;refreshList()}
function selectShip(id){selected=id;refreshList()}
function refreshList(){
 const el=document.getElementById('fleetList');el.innerHTML='';
 fleet.forEach(s=>{
  const d=document.createElement('div');d.className='shipItem'+(s.id===selected?' sel':'');d.onclick=()=>selectShip(s.id);
  const col=s.damage==='normal'?'#3a67ff':s.damage==='damaged'?'#ffd22f':'#f33';
  d.innerHTML='<span class="dot" style="background:'+col+'"></span><span class="shipName">'+typeNames[s.type]+' #'+s.id+'<br><span class="small">'+damageLabel[s.damage]+'</span></span>';
  el.appendChild(d);
 });
}
refreshList();

function applyFormation(kind){
 const n=fleet.length,gapX=520,gapY=430;
 fleet.forEach((s,i)=>{
  if(kind==='line'){s.x=0;s.y=(i-(n-1)/2)*gapY;s.z=0}
  else if(kind==='column'){s.x=-i*gapX;s.y=0;s.z=0}
  else if(kind==='wedge'){if(i===0){s.x=0;s.y=0}else{const row=Math.ceil(i/2),side=(i%2?1:-1);s.x=-row*gapX;s.y=side*row*gapY*.8}s.z=0}
  else if(kind==='convex'){const row=Math.floor(i/3),pos=i%3;s.x=-row*gapX;s.y=(pos-1)*gapY;if(row===0&&pos===1)s.x=180;s.z=0}
 });
}

let yaw=-.65,pitch=.42,dist=3100;
function resetView(){yaw=-.65;pitch=.42;dist=3100}
function setView(v){if(v==='iso'){yaw=-.65;pitch=.42}if(v==='front'){yaw=0;pitch=0}if(v==='side'){yaw=-Math.PI/2;pitch=0}if(v==='top'){yaw=-Math.PI/2;pitch=Math.PI/2-.02}}
let dragging=false,lastX=0,lastY=0,lastPinch=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw+=dx*.006;pitch+=dy*.006;pitch=Math.max(-1.45,Math.min(1.45,pitch))});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist*=Math.exp(e.deltaY*.001);dist=Math.max(900,Math.min(7000,dist))},{passive:false});
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)lastPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let p=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lastPinch){dist*=lastPinch/p;dist=Math.max(900,Math.min(7000,dist))}lastPinch=p}},{passive:false});

function resize(){const dpr=Math.min(devicePixelRatio||1,2),w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.027,.043,.094,1);

function drawShip(s,MVP){
 const scale=typeScale[s.type],M=modelMatrix(s.x,s.y,s.z,scale),color=damageColor[s.damage],alpha=s.damage==='sunk'?.32:1.0,dim=s.damage==='sunk'?.48:1.0;
 if(alpha<1){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA)}else gl.disable(gl.BLEND);

 bind(outline,OL);gl.cullFace(gl.FRONT);
 gl.uniformMatrix4fv(OL.uMVP,false,new Float32Array(MVP));gl.uniformMatrix4fv(OL.uModel,false,new Float32Array(M));gl.uniform1f(OL.uExpand,4.5/scale);gl.uniform1f(OL.uAlpha,alpha);
 gl.drawArrays(gl.TRIANGLES,0,POS.length/3);

 bind(toon,TL);gl.cullFace(gl.BACK);
 gl.uniformMatrix4fv(TL.uMVP,false,new Float32Array(MVP));gl.uniformMatrix4fv(TL.uModel,false,new Float32Array(M));gl.uniform1f(TL.uExpand,0);gl.uniform3fv(TL.uBase,new Float32Array(color));gl.uniform1f(TL.uAlpha,alpha);gl.uniform1f(TL.uDim,dim);
 gl.drawArrays(gl.TRIANGLES,0,POS.length/3);
}

function frame(){
 resize();gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const ex=dist*Math.cos(pitch)*Math.cos(yaw),ey=dist*Math.cos(pitch)*Math.sin(yaw),ez=dist*Math.sin(pitch);
 const P=perspective(46*Math.PI/180,canvas.width/canvas.height,10,15000),V=lookAt([ex,ey,ez],[0,0,0],[0,0,1]),MVP=mul(P,V);
 fleet.forEach(s=>drawShip(s,MVP));
 requestAnimationFrame(frame);
}
frame();
</script>
</body>
