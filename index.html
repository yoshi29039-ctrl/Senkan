<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>LFS-01 3D Viewer</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#070b18; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #app { width:100%; height:100%; position:relative; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .topbar {
      position:absolute; top:12px; left:12px; right:12px;
      display:flex; gap:8px; flex-wrap:wrap; z-index:5;
    }
    button {
      border:1px solid rgba(255,255,255,.18); background:rgba(15,22,45,.78); color:#eef3ff;
      padding:10px 12px; border-radius:12px; font-size:14px; backdrop-filter: blur(8px);
    }
    .title {
      position:absolute; left:16px; bottom:14px; z-index:5; color:#d9e5ff;
      background:rgba(7,11,24,.62); border:1px solid rgba(255,255,255,.10);
      padding:10px 12px; border-radius:12px; font-size:13px;
    }
    .hint {
      position:absolute; right:16px; bottom:14px; z-index:5; color:#aebcdb;
      background:rgba(7,11,24,.55); padding:8px 10px; border-radius:10px; font-size:12px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button data-view="iso">斜め</button>
    <button data-view="front">正面</button>
    <button data-view="side">側面</button>
    <button data-view="top">上面</button>
    <button id="reset">リセット</button>
  </div>
  <div class="title">LFS-01 Albion Nova v2 — 3D Viewer</div>
  <div class="hint">ドラッグ: 回転 / ピンチ・ホイール: 拡大縮小</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.166.1/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.166.1/examples/js/controls/OrbitControls.js"></script>
<script>
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b18);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 10000);
camera.position.set(1450, 900, 900);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.prepend(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xbfd3ff, 0x10131e, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-900, 700, 1100); scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea1ff, 1.3);
rim.position.set(900, -900, 300); scene.add(rim);

const grid = new THREE.GridHelper(2800, 28, 0x29365f, 0x131a30);
grid.rotation.x = Math.PI/2;
grid.position.z = -155;
scene.add(grid);

let ship = null;
const loader = new THREE.OBJLoader();
loader.load('LFS-01_Albion_Nova_v2.obj', obj => {
  ship = obj;
  ship.traverse(c => {
    if(c.isMesh){
      c.material = new THREE.MeshStandardMaterial({
        color: 0x333760,
        metalness: 0.68,
        roughness: 0.34
      });
    }
  });
  // OBJ axes: X fore-aft. Rotate so Z is up in Three.js display.
  ship.rotation.x = -Math.PI/2;
  scene.add(ship);
  frameShip();
});

function frameShip(){
  if(!ship) return;
  const box = new THREE.Box3().setFromObject(ship);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  controls.target.copy(center);
  const m = Math.max(size.x,size.y,size.z);
  camera.position.set(center.x + m*1.05, center.y + m*0.75, center.z + m*0.65);
  camera.near = Math.max(0.1, m/1000);
  camera.far = m*20;
  camera.updateProjectionMatrix();
  controls.update();
}

function setView(v){
  if(!ship) return;
  const box = new THREE.Box3().setFromObject(ship);
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const d = Math.max(s.x,s.y,s.z)*1.35;
  controls.target.copy(c);
  if(v==='front') camera.position.set(c.x-d,c.y,c.z);
  if(v==='side') camera.position.set(c.x,c.y+d,c.z);
  if(v==='top') camera.position.set(c.x,c.y,c.z+d);
  if(v==='iso') camera.position.set(c.x+d,c.y+d*0.7,c.z+d*0.55);
  camera.lookAt(c); controls.update();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.getElementById('reset').onclick = frameShip;

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
